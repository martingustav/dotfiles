music_directory        "~/Music"
playlist_directory     "~/Music/playlists"
auto_update            "yes"
bind_to_address        "127.0.0.1"
restore_paused         "yes"
max_output_buffer_size "16384"
replaygain             "album"
replaygain_preamp      "0"
replaygain_limit       "yes"


audio_output {
    type "pulse"
    name "pulse"
}
